name: Deploy

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build Project
        run: |
          npm install
          npm run build
      - name: Deploy to Linode
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: './projects/client/build,./projects/client/package.json,./projects/server/src,./projects/server/package.json,./deploy.config.js,./package*.json'
          target: '${{ secrets.SSH_FOLDER }}'
      - name: Run App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SSH_FOLDER }}
            mkdir -p projects/server
            cat > projects/server/.env <<'EOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            RAJAONGKIR_API_KEY=${{ secrets.RAJAONGKIR_API_KEY }}
            OPENCAGE_API_KEY=${{ secrets.OPENCAGE_API_KEY }}
            CLIENT_BASE_URL=${{ secrets.CLIENT_BASE_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            EOF
            npm install
            pm2 restart deploy.config.js || pm2 start deploy.config.js
